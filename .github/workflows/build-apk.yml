name: Build Tareeq APK

on:
  push:
    branches: [ main ]
    paths:
      - 'website-android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Tareeq.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tareeq-apk
          path: Tareeq.apk
